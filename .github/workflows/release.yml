name: Release

# Workflow minimale: quando viene pushato un tag "vX.Y.Z" crea una GitHub Release
# usando il file docs/releases/vX.Y.Z.md come corpo della release.
#
# Uso locale tipico:
#   npm run release:notes -- v0.3.0   # scaffolda docs/releases/v0.3.0.md + CHANGELOG
#   git commit -am "chore: release v0.3.0"
#   git tag -a v0.3.0 -m "v0.3.0"
#   git push --follow-tags

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release body
        id: body
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "notes=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NutriFlow ${{ steps.body.outputs.version }}
          body_path: ${{ steps.body.outputs.notes }}
          draft: false
          prerelease: false
